<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>我的体验 · Engineer Quest</title>
  <link rel="stylesheet" href="/invitation.css">
  <link rel="stylesheet" href="/experience.css">
  <script src="/experience.js" type="module"></script>
</head>
<body class="quest-shell quest-experience">
  <header class="quest-header">
    <a class="wordmark" href="/">Engineer <span>Quest</span></a>
    <a class="site-purpose" href="/">返回课程</a>
  </header>
  <main class="experience-layout">
    <aside class="experience-sidebar" aria-label="课程与体验进度">
      <div class="workshop-preview">
        <img src="/art/eq-night-lab-v2.webp" width="1672" height="941" alt="" loading="lazy">
        <p id="batch">Engineer Quest</p>
      </div>
      <ol id="steps" class="steps" aria-label="体验进度" hidden>
        <li id="pre-step"><span>课前问卷</span><small></small></li>
        <li id="workshop-step"><span>上课</span><small></small></li>
        <li id="post-step"><span>课后问卷</span><small></small></li>
      </ol>
    </aside>
    <section class="experience-content" aria-labelledby="experience-title">
      <header class="experience-heading">
        <h1 id="experience-title" tabindex="-1">我的体验</h1>
        <p id="experience-intro" hidden></p>
      </header>
      <ol id="course-overview" class="course-overview" aria-label="体验课程的三个环节" hidden>
        <li><strong>课前问卷</strong><span id="pre-summary"></span></li>
        <li><strong>上课 · 工程工位</strong><span>接线、设置亮灯条件，用明暗变化测试小灯。</span></li>
        <li><strong>课后问卷</strong><span>回顾各环节的感受，记下一次修改或测试。</span></li>
      </ol>
      <section id="lesson-brief" class="lesson-brief" aria-label="课堂任务" hidden>
        <p>在工位里把感光元件（用来检测明暗的小零件）和灯接起来。挡住光再放开，看看灯能不能在暗处亮起来、变亮时熄灭。</p>
        <p>工位建议用电脑操作。</p>
      </section>
      <div id="links" class="actions experience-actions" hidden>
        <a id="start-pre" class="action" href="/experience.html?phase=pre" hidden>开始课前问卷</a>
        <a id="workshop" class="action" href="/workshop.html" hidden>进入工程工位</a>
        <a id="report-link" class="action" href="/report.html" hidden>查看体验报告</a>
        <a id="back" class="study-back" href="/experience.html" hidden>← 返回体验进度</a>
      </div>
      <section id="post-access" class="post-access" aria-labelledby="post-access-title" hidden>
        <h2 id="post-access-title">课后问卷已开放</h2>
        <p>可以上完课再回来填写。没有体验到的环节，也可以照实回答。</p>
        <a class="action secondary" href="/experience.html?phase=post">填写课后问卷</a>
      </section>
      <section id="completion" aria-label="已保存的答卷" hidden>
        <div id="submitted-answers"></div>
      </section>
      <form id="answers" hidden novalidate></form>
      <p id="status" role="status" aria-live="polite">正在读取体验…</p>
      <button id="retry" class="secondary" type="button" hidden>重新读取</button>
    </section>
  </main>
</body>
</html>
